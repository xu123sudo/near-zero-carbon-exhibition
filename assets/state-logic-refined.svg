<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-label="并网—孤岛—恢复的状态逻辑"><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263e34;font-weight:400}.title{font-size:28px;font-weight:600}.node-title{font-size:20px;font-weight:500}.detail{font-size:16px;fill:#7e8b7a}.section{font-size:17px;font-weight:500;fill:#688775}.caption{font-size:15px;fill:#7e8b7a}.accent{font-size:16px;fill:#ab8c56}.state{font-size:20px;font-weight:500}</style><rect x="0" y="0" width="1600" height="550" fill="#fafbf7" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4 L0 8 Z" fill="#688775" /></marker></defs><text x="800" y="48" class="title" text-anchor="middle">并网—孤岛—恢复的状态逻辑</text><text x="800" y="80" class="detail" text-anchor="middle">阶段名称、转换条件与故障闭锁采用统一字体和层级</text><rect x="60" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="162.5" y="181" class="state" text-anchor="middle">S0</text><text x="162.5" y="211" class="node-title" text-anchor="middle">正常并网</text><rect x="315" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="417.5" y="181" class="state" text-anchor="middle">S1</text><text x="417.5" y="211" class="node-title" text-anchor="middle">孤岛预备</text><rect x="570" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="672.5" y="181" class="state" text-anchor="middle">S2</text><text x="672.5" y="211" class="node-title" text-anchor="middle">解列过渡</text><rect x="825" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="927.5" y="181" class="state" text-anchor="middle">S3</text><text x="927.5" y="211" class="node-title" text-anchor="middle">孤岛运行</text><rect x="1080" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="1182.5" y="181" class="state" text-anchor="middle">S4</text><text x="1182.5" y="211" class="node-title" text-anchor="middle">同期 / 恢复</text><rect x="1335" y="150" width="205" height="96" rx="7" fill="#ffffff" stroke="#cdd8c9" stroke-width="1.5" /><text x="1437.5" y="181" class="state" text-anchor="middle">S0</text><text x="1437.5" y="211" class="node-title" text-anchor="middle">恢复并网</text><path d="M265,198 L315,198" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M520,198 L570,198" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M775,198 L825,198" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M1030,198 L1080,198" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M1285,198 L1335,198" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="290" y="289" class="detail" text-anchor="middle">电网失电信号</text><text x="545" y="289" class="detail" text-anchor="middle">PCC 开断</text><text x="800" y="289" class="detail" text-anchor="middle">连接系数下降</text><text x="1055" y="289" class="detail" text-anchor="middle">电网恢复请求</text><text x="1310" y="289" class="detail" text-anchor="middle">同期持续满足</text><text x="1310" y="312" class="detail" text-anchor="middle">连接系数 ≥ 0.99</text><path d="M672.5,246 L672.5,377" fill="none" stroke="#688775" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="711" y="348" class="accent" text-anchor="start">故障优先闭锁</text><rect x="570" y="377" width="205" height="85" rx="7" fill="#f3f0e7" stroke="#cdd8c9" stroke-width="1.5" /><text x="672.5" y="408" class="state" text-anchor="middle">S5</text><text x="672.5" y="438" class="node-title" text-anchor="middle">故障闭锁</text><text x="800" y="513" class="caption" text-anchor="middle">0.99 为 PCC 等值连接系数，不代表断路器机械触头行程。</text></svg>